apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: employee-management

spec:
  replicas: 1

  selector:
    matchLabels:
      app: mysql

  template:
    metadata:
      labels:
        app: mysql

    spec:
      containers:
        - name: mysql
          image: mysql:8
          ports:
            - containerPort: 3306

          env:
            - name: MYSQL_ROOT_PASSWORD
              value: root

            - name: MYSQL_DATABASE
              value: employee_db
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-service
  namespace: employee-management

spec:
  selector:
    app: mysql

  ports:
    - port: 3306
      targetPort: 3306

  type: ClusterIP